<!DOCTYPE html>
<html>
<head>
    <title>Size Chart</title>
    <style>
        table {
            width: 60%;
            margin: 20px auto;
            border-collapse: collapse;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        thead {
            background-color: #f2f2f2;
        }

        th {
            font-weight: bold;
        }
    </style>
</head>

<body>

    <table>
        <thead>
            <tr>
                <th>Size</th>
                <th>Chest (in)</th>
                <th>Waist (in)</th>
                <th>Hip (in)</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>S</td>
                <td>36</td>
                <td>30</td>
                <td>38</td>
            </tr>

            <tr>
                <td>M</td>
                <td>38</td>
                <td>32</td>
                <td>40</td>
            </tr>

            <tr>
                <td>L</td>
                <td>40</td>
                <td>34</td>
                <td>42</td>
            </tr>

            <tr>
                <td>XL</td>
                <td>42</td>
                <td>36</td>
                <td>44</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
